<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fix My Ward</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a civic notice board. Reports are posts with reference numbers and a visible clock;
   the map and ward pages exist to answer one question: who is responsible here, and what have they done? */
:root{
  --bg:#E8EDEB;--surface:#FFFFFF;--surface2:#F1F5F3;--ink:#12201B;--muted:#54655E;--line:#D0DAD6;
  --accent:#0A6B4D;--accent-ink:#FFFFFF;--rep:#B3261E;--ack:#8F5E00;--prog:#1D5FA8;--done:#1B7F4B;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1512;--surface:#15201B;--surface2:#1B2822;--ink:#E6EFEA;--muted:#9DB0A8;--line:#2A3A33;
  --accent:#3FBF8A;--accent-ink:#05241A;--rep:#FF8F85;--ack:#E3B341;--prog:#7AB4F5;--done:#5FD39A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1512;--surface:#15201B;--surface2:#1B2822;--ink:#E6EFEA;--muted:#9DB0A8;--line:#2A3A33;
  --accent:#3FBF8A;--accent-ink:#05241A;--rep:#FF8F85;--ack:#E3B341;--prog:#7AB4F5;--done:#5FD39A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:22px;font-weight:800}h3{font-size:16px;font-weight:700}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 0;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:flex;align-items:baseline;gap:8px}
.brand small{font:500 12px var(--f-body);color:var(--muted);letter-spacing:0}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{padding:7px 12px;text-decoration:none;color:var(--ink);font-weight:500;border-radius:4px;border:1px solid transparent}
nav a:hover{background:var(--surface)}
nav a.on{border-color:var(--ink);background:var(--surface)}
nav a.cta{background:var(--accent);color:var(--accent-ink);font-weight:600}
nav a.cta.on{outline:2px solid var(--ink)}

/* primitives */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--surface);padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);min-height:38px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--rep);color:var(--rep)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.card.flat{background:var(--surface2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill.rep{--c:var(--rep)}.pill.ack{--c:var(--ack)}.pill.prog{--c:var(--prog)}.pill.done{--c:var(--done)}.pill.late{--c:var(--rep)}.pill.ok{--c:var(--done)}.pill.neutral{--c:var(--muted)}
.chip{display:inline-block;padding:2px 8px;border:1px solid var(--line);border-radius:4px;font-size:12.5px;background:var(--surface2);color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13.5px}
label.f>span.hint{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],input[type=email],input[type=number],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-height:38px}
textarea{min-height:90px;resize:vertical}
.notice{border-left:4px solid var(--prog);background:var(--surface2);padding:10px 12px;border-radius:0 4px 4px 0;font-size:13.5px}
.notice.warn{border-color:var(--ack)}.notice.bad{border-color:var(--rep)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font:800 24px var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.bad b{color:var(--rep)}.stat.good b{color:var(--done)}

/* feed */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.post{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 0 14px;position:relative;overflow:hidden}.post>:not(.pic){margin-inline:16px}
.post:hover{border-color:var(--ink)}
.post h3 a{color:var(--ink);text-decoration:none}
.post h3 a::after{content:"";position:absolute;inset:0}
.post .meta{color:var(--muted);font-size:13.5px}
.post .foot{grid-column:1/-1;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.pic{position:relative;aspect-ratio:16/9;max-height:260px;width:100%;background:var(--surface2);overflow:hidden;border-bottom:1px solid var(--line)}
.pic img,.pic svg{width:100%;height:100%;object-fit:cover;display:block}
.pic.big{max-height:460px;aspect-ratio:16/10;border:1px solid var(--line);border-radius:6px}
.pic .cap{position:absolute;left:8px;bottom:8px;font:500 11px var(--f-mono);background:rgba(0,0,0,.68);color:#fff;padding:2px 7px;border-radius:3px}
.post .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.demo-tag{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;border:1px dashed var(--muted);padding:1px 6px;border-radius:3px;color:var(--muted)}

/* hero carousel */
.hero{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.cview{overflow:hidden;touch-action:pan-y}
.ctrack{display:flex;transition:transform .5s ease}
.cslide{flex:0 0 100%;min-width:0;position:relative;padding:22px;min-height:360px}
.cbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface2)}
.cdots{display:flex;gap:8px;flex:1;justify-content:center}
.cdots button{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;padding:0;cursor:pointer}
.cdots button[aria-selected=true]{background:var(--ink)}
.eyebrow{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.eyebrow.lt{color:rgba(255,255,255,.82)}
.hl{font-size:clamp(24px,4.2vw,36px);font-weight:800}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mini{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.mini:hover{border-color:var(--ink)}
.mini .pic{aspect-ratio:16/10}
.mini .mb{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.ba{grid-template-columns:1fr}}
.ba figure{margin:0;position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.ba svg{display:block;width:100%;height:auto}
.ba figcaption{position:absolute;top:8px;left:8px;font:700 12px var(--f-mono);padding:3px 9px;border-radius:3px;text-transform:uppercase;letter-spacing:.08em;background:#B3261E;color:#fff}
.ba figure.after figcaption{background:#1B7F4B}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 12px;border:1px solid var(--ink);border-radius:4px;background:var(--surface);cursor:pointer;font-weight:500}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.cslide.fx{padding:0;color:#fff;min-height:400px;display:flex}
.fx svg.bg{position:absolute;inset:0;width:100%;height:100%}
.fx .scrim{position:absolute;inset:0;background:rgba(10,14,30,.58)}
.fx .inner{position:relative;max-width:660px;margin:0 auto;padding:44px 22px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;flex:1}
.fx.join{background:linear-gradient(135deg,#0A6B4D,#0E3B4A)}
.fx.join .inner{max-width:860px}
.fx .pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;width:100%;text-align:left}
.fx .pts div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:10px 12px;font-size:14px}
.fx .pts b{display:block;font-family:var(--f-display);font-size:16px}
.btn.light{background:#fff;color:#12201B;border-color:#fff;font-weight:600}
.btn.ghost{background:transparent;color:#fff;border-color:#fff}
.fx .btn:hover{filter:brightness(.93)}
/* fun facts */
.ffeat{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:22px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:22px}
@media(max-width:640px){.ffeat{grid-template-columns:minmax(0,1fr);gap:10px}}
.ffeat .big{font:800 clamp(38px,7vw,60px)/1 var(--f-display);letter-spacing:-.02em;overflow-wrap:break-word}
.ffeat .big.long{font-size:clamp(26px,4.4vw,38px)}
.ffeat .eyebrow{color:inherit;opacity:.85}
.ffeat .btn{align-self:flex-start;background:transparent;color:inherit;border-color:currentColor}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fact{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.fact .st{font:800 28px/1.1 var(--f-display);color:var(--accent);overflow-wrap:anywhere}
.fact .sl{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fact p{margin:0;font-size:14.5px}
.fact .chip{align-self:flex-start;margin-top:auto}
.quiz .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.quiz .opts button{text-align:left;padding:10px 12px;border:1px solid var(--ink);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:500}
.quiz .opts button:hover:not([disabled]){background:var(--surface2)}
.quiz .opts button.right{border-color:var(--done);background:color-mix(in srgb,var(--done) 16%,var(--surface))}
.quiz .opts button.wrong{border-color:var(--rep);background:color-mix(in srgb,var(--rep) 14%,var(--surface))}
/* area profile */
.areabtn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn{padding:7px 12px;border:1px solid var(--ink);border-radius:4px;background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn:hover{background:var(--surface2)}
.ovl{position:fixed;inset:0;background:rgba(10,20,16,.62);z-index:30;display:grid;place-items:center;padding:16px}
.ovl .dlg{background:var(--surface);color:var(--ink);border:1px solid var(--ink);border-radius:8px;max-width:540px;width:100%;max-height:92vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.sugglist{list-style:none;margin:4px 0 0;padding:0;background:var(--surface);border:1px solid var(--ink);border-radius:4px;max-height:200px;overflow:auto}
.sugglist li button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;background:none;cursor:pointer}
.sugglist li button:hover,.sugglist li button:focus-visible{background:var(--surface2)}
.fsec{display:flex;flex-direction:column;gap:10px}
.fact .where{font-size:12.5px;color:var(--muted)}
/* detail */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:860px){.detail{grid-template-columns:minmax(0,1fr)}}
.photo{width:100%;max-height:420px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--surface2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.step{padding:8px 6px;text-align:center;font-size:12.5px;font-weight:600;border-top:4px solid var(--line);color:var(--muted)}
.step.on{border-color:var(--c);color:var(--ink)}
.step.s0{--c:var(--rep)}.step.s1{--c:var(--ack)}.step.s2{--c:var(--prog)}.step.s3{--c:var(--done)}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--c,var(--muted))}
.tl li.rep{--c:var(--rep)}.tl li.ack{--c:var(--ack)}.tl li.prog{--c:var(--prog)}.tl li.done{--c:var(--done)}.tl li.late{--c:var(--rep)}
.tl b{display:block}
.tl .when{font-size:12.5px;color:var(--muted)}
.tl img{max-width:260px;width:100%;border-radius:4px;margin-top:6px;border:1px solid var(--line)}
kbd.addr{display:block;font:500 13px var(--f-mono);background:var(--surface2);padding:8px 10px;border:1px solid var(--line);border-radius:4px;overflow-wrap:anywhere;user-select:all}
.comment{padding:10px 0;border-top:1px solid var(--line)}
.comment .by{font-size:12.5px;color:var(--muted)}

/* new report */
.form{max-width:760px;display:flex;flex-direction:column;gap:18px}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px;border:2px dashed var(--ink);border-radius:6px;background:var(--surface);cursor:pointer;text-align:center}
.drop img{max-height:260px;max-width:100%;border-radius:4px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.cat{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.cat input{margin-top:3px}
.cat:has(input:checked){border-color:var(--accent);outline:2px solid var(--accent)}
.cat span small{display:block;color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sect{display:flex;flex-direction:column;gap:12px}
.sect>h3{display:flex;gap:10px;align-items:center}
.sect>h3 i{font:500 12px var(--f-mono);font-style:normal;background:var(--ink);color:var(--bg);padding:2px 7px;border-radius:3px}

/* explore */
.explore{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
@media(max-width:860px){.explore{grid-template-columns:minmax(0,1fr)}}
.mapcard{position:sticky;top:8px}
@media(max-width:860px){.mapcard{position:static}}
canvas.map{width:100%;height:auto;display:block;border-radius:4px;cursor:pointer;background:var(--surface2)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:13.5px;align-items:center}
.crumbs span.sep{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;text-decoration:none;color:var(--ink)}
.item:hover{border-color:var(--ink)}
.wards{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;max-height:280px;overflow:auto;padding:2px}
.wards a{display:block;text-align:center;padding:6px 0;border:1px solid var(--line);border-radius:4px;text-decoration:none;color:var(--ink);background:var(--surface);font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.wards a:hover{border-color:var(--ink)}
.wards a.has{background:color-mix(in srgb,var(--ack) 22%,var(--surface));border-color:var(--ack)}
.wards a.late{background:color-mix(in srgb,var(--rep) 24%,var(--surface));border-color:var(--rep)}
.person{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font:700 18px var(--f-display);flex:none;color:var(--muted)}
.party{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600}
.party i{width:10px;height:10px;border-radius:2px;background:hsl(var(--h) 60% 45%)}
.sugg{position:relative}
.sugg ul{list-style:none;margin:4px 0 0;padding:0;background:var(--surface);border:1px solid var(--ink);border-radius:4px;max-height:260px;overflow:auto}
.sugg li button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;background:none;cursor:pointer}
.sugg li button:hover,.sugg li button:focus-visible{background:var(--surface2)}

/* ranking */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface2)}
td.num,th.num{text-align:right}
.bar{display:inline-block;height:8px;border-radius:2px;background:var(--done);vertical-align:middle;min-width:2px}
tr:last-child td{border-bottom:0}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:20;max-width:90vw;font-weight:500}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
<meta name="description" content="Report potholes, blown transformers and dumping in your ward, then track every update and see which municipal offices are keeping up.">
<meta property="og:title" content="Fix My Ward">
<meta property="og:description" content="Report service delivery problems in your ward and hold municipal offices to account.">
<meta property="og:type" content="website">
<style>
/* reset the artifact viewer normally supplies */
:root{color-scheme:light}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>


<div class="wrap" id="root"></div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
/* native append would print arrays and false as text; flatten and skip empties instead */
{const _a=Element.prototype.append;Element.prototype.append=function(...x){_a.apply(this,x.flat(Infinity).filter(v=>v!=null&&v!==false));};}
const DAY=864e5;
let heroTimer=null;

/* ------------------------------------------------------------------ static reference data */
const PROVS=[
 {id:'GP',name:'Gauteng',hue:215},{id:'WC',name:'Western Cape',hue:15},{id:'NC',name:'Northern Cape',hue:42},
 {id:'EC',name:'Eastern Cape',hue:140},{id:'FS',name:'Free State',hue:95},{id:'KZN',name:'KwaZulu-Natal',hue:178},
 {id:'NW',name:'North West',hue:275},{id:'LP',name:'Limpopo',hue:330},{id:'MP',name:'Mpumalanga',hue:62}];
const PROV=Object.fromEntries(PROVS.map(p=>[p.id,p]));

function readExifGps(buf){try{const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;let off=2;
 while(off<v.byteLength-4){const mk=v.getUint16(off);off+=2;if(mk===0xFFE1){const len=v.getUint16(off);if(v.getUint32(off+2)===0x45786966)return tiffGps(v,off+8);off+=len;}
  else if((mk&0xFF00)!==0xFF00||mk===0xFFDA)break;else off+=v.getUint16(off);}}catch(e){}return null;}
function tiffGps(v,s){const le=v.getUint16(s)===0x4949,u16=o=>v.getUint16(o,le),u32=o=>v.getUint32(o,le);
 const ifd=s+u32(s+4),n=u16(ifd);let gps=null;for(let i=0;i<n;i++){const e=ifd+2+i*12;if(u16(e)===0x8825)gps=s+u32(e+8);}
 if(gps==null)return null;const g={},gn=u16(gps);
 for(let i=0;i<gn;i++){const e=gps+2+i*12,tag=u16(e);
  if(tag===1||tag===3)g[tag]=String.fromCharCode(v.getUint8(e+8));
  if(tag===2||tag===4){const o=s+u32(e+8),r=k=>u32(o+k*8)/(u32(o+k*8+4)||1);g[tag]=r(0)+r(1)/60+r(2)/3600;}}
 if(g[2]==null||g[4]==null)return null;const lat=g[2]*(g[1]==='S'?-1:1),lon=g[4]*(g[3]==='W'?-1:1);
 return(isFinite(lat)&&isFinite(lon)&&(lat||lon))?{lat,lon}:null;}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i);};i.onerror=()=>rej(new Error('image'));i.src=u;});}
async function compress(file,max,q){const img=await loadImg(file);let out='';
 for(const [m,qq] of [[max,q],[Math.round(max*.8),q-.1],[Math.round(max*.6),q-.2]]){
  const sc=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.naturalWidth*sc));c.height=Math.max(1,Math.round(img.naturalHeight*sc));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',qq);if(out.length<190000)break;}

function derive(){
 const now=Date.now(),U=groupBy(S.updates,'reportId'),C=groupBy(S.comments,'reportId'),F=groupBy(S.confirms,'reportId'),V=groupBy(S.verdicts,'reportId');
 const all=S.reports.map(r=>{
  const cat=CAT[r.cat]||CAT.other,mun=MUNI[r.munId]||null,ups=(U[r._id]||[]).slice().sort((a,b)=>a.at-b.at),last=ups[ups.length-1];
  const status=last?last.status:'reported',due=r.createdAt+cat.sla*DAY,done=status==='resolved';
  const vs=V[r._id]||[],fixed=vs.filter(x=>x.v==='fixed').length,notfixed=vs.filter(x=>x.v==='notfixed').length;
  return {...r,cat,catId:r.cat,mun,ups,status,due,done,overdue:!done&&now>due,resolvedAt:done?last.at:null,
   closeMs:done?last.at-r.createdAt:null,late:done&&last.at>due,age:now-r.createdAt,
   coms:(C[r._id]||[]).slice().sort((a,b)=>a.at-b.at),affected:(F[r._id]||[]),vs,fixed,notfixed,disputed:done&&notfixed>fixed};});
 const byId=new Map(all.map(r=>[r._id,r]));
 return {all,byId,rows:all.filter(r=>!(S.hideDemo&&r.demo)),demoCount:all.filter(r=>r.demo).length};}
function statsFor(rows){const res=rows.filter(r=>r.done),closes=res.map(r=>r.closeMs);
 return {total:rows.length,open:rows.length-res.length,resolved:res.length,overdue:rows.filter(r=>r.overdue).length,med:median(closes),
  rate:rows.length?res.length/rows.length:0,disputed:rows.filter(r=>r.disputed).length};}
const wardLabel=r=>(r.ward?'Ward '+r.ward+' · ':'')+(r.mun?r.mun.name:'Unknown municipality');
